<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Big Product' Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">Hackathon Build · India Wellness Intelligence</p>
        <h1>Next Big Product' Radar</h1>
        <p class="hero-copy">
          A founder-facing signal dashboard that separates durable wellness trends from short-lived hype waves.
        </p>
      </header>

      <section class="controls card-surface">
        <div class="control-group">
          <label for="searchInput">Search trend</label>
          <input id="searchInput" type="search" placeholder="e.g., ashwagandha, gut, hydration" />
        </div>

        <div class="control-group">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter">
            <option value="all">All categories</option>
          </select>
        </div>

        <div class="control-group">
          <label for="sortBy">Sort by</label>
          <select id="sortBy">
            <option value="velocity">Signal Velocity</option>
            <option value="opportunity">Opportunity (₹ Cr)</option>
            <option value="risk">Risk Score</option>
          </select>
        </div>
      </section>

      <section class="summary-grid" id="summaryGrid"></section>
      <section id="trendGrid" class="trend-grid"></section>
    </div>

    <div id="briefModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-panel">
        <button id="closeModal" class="close-btn" aria-label="Close">×</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
